<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const CFG = window.APP_CONFIG;
const CONFIGURED = CFG.SUPABASE_URL && !CFG.SUPABASE_URL.includes("PASTE_") &&
                   CFG.SUPABASE_ANON_KEY && !CFG.SUPABASE_ANON_KEY.includes("PASTE_");

const sb = CONFIGURED ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY) : null;

/* ---------- helpers ---------- */
const money = (n) => CFG.CURRENCY + new Intl.NumberFormat('en-IN', { maximumFractionDigits: 2 }).format(Number(n || 0));
const BANDS = [25, 50, 100, 250, 500, 1000];
const gramsLabel = (g) => g >= 1000 ? (g/1000) + "kg" : g + "g";
const startOf = (kind) => {
  const d = new Date(); d.setHours(0,0,0,0);
  if (kind === 'today') return d;
  if (kind === 'week')  { const day = (d.getDay()+6)%7; d.setDate(d.getDate()-day); return d; } // Monday
  if (kind === 'month') { d.setDate(1); return d; }
  return new Date(0);
};
const fmtDate = (iso) => new Date(iso).toLocaleString('en-IN', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });

/* ---------- tiny inline icons ---------- */
const I = {
  cart:  (p)=><svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>,
  lock:  (p)=><svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
  chart: (p)=><svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 3v18h18"/><rect x="7" y="10" width="3" height="8"/><rect x="12" y="6" width="3" height="12"/><rect x="17" y="13" width="3" height="5"/></svg>,
  box:   (p)=><svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 8V21H3V8"/><rect x="1" y="3" width="22" height="5"/><path d="M10 12h4"/></svg>,
  trash: (p)=><svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>,
  plus:  (p)=><svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14M5 12h14"/></svg>,
  check: (p)=><svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg>,
  back:  (p)=><svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>,
  down:  (p)=><svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3v14m-6-6 6 6 6-6M4 21h16"/></svg>,
};

/* ================= NOT CONFIGURED SCREEN ================= */
function Setup() {
  const [copied, setCopied] = useState(false);
  const sql = `-- Run this once in Supabase → SQL Editor → New query → Run
create table if not exists products (
  id uuid primary key default gen_random_uuid(),
  name text not null,
  cost_per_100g numeric not null default 0,
  price_per_100g numeric not null default 0,
  active boolean not null default true,
  created_at timestamptz not null default now()
);
create table if not exists sales (
  id uuid primary key default gen_random_uuid(),
  product_id uuid,
  product_name text not null,
  grams numeric not null,
  qty int not null default 1,
  sale_amount numeric not null,
  cost_amount numeric not null,
  profit numeric not null,
  sold_by text,
  created_at timestamptz not null default now()
);
alter table products enable row level security;
alter table sales enable row level security;
create policy "shop access products" on products for all using (true) with check (true);
create policy "shop access sales" on sales for all using (true) with check (true);`;
  const copy = () => { navigator.clipboard.writeText(sql); setCopied(true); setTimeout(()=>setCopied(false),1500); };
  const Step = ({n, children}) => (
    <div className="flex gap-3">
      <div className="shrink-0 w-7 h-7 rounded-full bg-[#3B6B35] text-white grid place-items-center text-sm font-semibold font-display">{n}</div>
      <div className="pt-0.5 text-[#4A3F30] leading-relaxed">{children}</div>
    </div>
  );
  return (
    <div className="max-w-xl mx-auto px-5 py-10">
      <p className="font-display text-2xl font-semibold text-[#3B6B35]">Almost there</p>
      <p className="mt-1 text-[#6B5D4F]">Connect a free database once, then this becomes your live profit tracker.</p>
      <div className="mt-6 space-y-5">
        <Step n="1">Create a free account at <span className="font-semibold">supabase.com</span> and start a new project (any name, any password).</Step>
        <Step n="2">Open <span className="font-semibold">SQL Editor → New query</span>, paste the code below, and press <span className="font-semibold">Run</span>.</Step>
        <div className="relative">
          <button onClick={copy} className="absolute right-2 top-2 text-xs font-semibold px-2.5 py-1 rounded-md bg-[#3B6B35] text-white">{copied ? "Copied" : "Copy"}</button>
          <pre className="text-xs bg-[#2A2117] text-[#EFE7D6] rounded-xl p-4 pt-9 overflow-x-auto leading-relaxed">{sql}</pre>
        </div>
        <Step n="3">Go to <span className="font-semibold">Project Settings → API</span>. Copy the <span className="font-semibold">Project URL</span> and the <span className="font-semibold">anon public</span> key.</Step>
        <Step n="4">Open this <span className="font-semibold">index.html</span> file, paste both into the CONFIG box at the top, set your own <span className="font-semibold">OWNER_PIN</span>, and save.</Step>
        <Step n="5">Upload the file to your GitHub repo and turn on Pages. Share the link with your employee — done.</Step>
      </div>
    </div>
  );
}

/* ================= TOAST ================= */
function Toast({ msg }) {
  if (!msg) return null;
  return (
    <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 flex items-center gap-2 bg-[#2A2117] text-white px-4 py-2.5 rounded-full shadow-lg text-sm font-medium">
      <I.check className="w-4 h-4 text-[#9CCB6B]" /> {msg}
    </div>
  );
}

/* ================= EMPLOYEE — LOG A SALE ================= */
function SaleScreen({ products, sales, reload, toast, goOwner }) {
  const [q, setQ] = useState("");
  const [pick, setPick] = useState(null);
  const [grams, setGrams] = useState(100);
  const [qty, setQty] = useState(1);
  const [name, setName] = useState(localStorage.getItem('dk_seller') || "");
  const [saving, setSaving] = useState(false);

  const active = products.filter(p => p.active !== false);
  const list = active.filter(p => p.name.toLowerCase().includes(q.toLowerCase()));
  const amount = pick ? pick.price_per_100g * grams/100 * qty : 0;

  const today = sales.filter(s => new Date(s.created_at) >= startOf('today'));
  const todayTotal = today.reduce((a,s)=>a+Number(s.sale_amount),0);

  const save = async () => {
    if (!pick) return;
    setSaving(true);
    localStorage.setItem('dk_seller', name);
    const sale_amount = pick.price_per_100g * grams/100 * qty;
    const cost_amount = pick.cost_per_100g  * grams/100 * qty;
    const { error } = await sb.from('sales').insert({
      product_id: pick.id, product_name: pick.name, grams, qty,
      sale_amount, cost_amount, profit: sale_amount - cost_amount, sold_by: name || null
    });
    setSaving(false);
    if (error) { toast("Couldn't save — check connection"); return; }
    toast("Sale saved");
    setPick(null); setQ(""); setGrams(100); setQty(1); reload();
  };

  const del = async (id) => {
    if (!confirm("Remove this sale?")) return;
    await sb.from('sales').delete().eq('id', id); reload();
  };

  return (
    <div className="max-w-md mx-auto px-4 pb-28">
      <header className="pt-6 pb-4">
        <p className="text-[#6B5D4F] text-sm">{CFG.SHOP_NAME}</p>
        <div className="flex items-end justify-between">
          <h1 className="font-display text-3xl font-semibold text-[#3B6B35] leading-tight">Log a sale</h1>
          <button onClick={goOwner} aria-label="Owner login" className="flex items-center gap-1.5 text-sm text-[#6B5D4F] px-3 py-1.5 rounded-full border border-[#E3D8C3] active:bg-[#F2EAD8]">
            <I.lock className="w-3.5 h-3.5" /> Owner
          </button>
        </div>
      </header>

      {/* today's running total */}
      <div className="rounded-2xl bg-[#3B6B35] text-white px-5 py-4 mb-5">
        <p className="text-[#CFE3B8] text-xs uppercase tracking-wide">Today's sales so far</p>
        <p className="font-display text-3xl font-semibold mt-0.5">{money(todayTotal)}</p>
        <p className="text-[#CFE3B8] text-xs mt-0.5">{today.length} {today.length===1?'sale':'sales'}</p>
      </div>

      {!pick ? (
        <>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search product…"
            className="w-full rounded-xl border border-[#E3D8C3] bg-white px-4 py-3 mb-3 outline-none focus:border-[#3B6B35] focus:ring-2 focus:ring-[#3B6B35]/20" />
          {active.length === 0 ? (
            <p className="text-center text-[#8A7B68] py-10 text-sm">No products yet. Ask the owner to add them.</p>
          ) : (
            <div className="grid grid-cols-2 gap-2.5">
              {list.map(p => (
                <button key={p.id} onClick={()=>setPick(p)}
                  className="text-left rounded-xl border border-[#E3D8C3] bg-white px-4 py-3.5 active:scale-[.98] active:bg-[#F7F1E3] transition">
                  <p className="font-semibold text-[#3A2E22] leading-snug">{p.name}</p>
                  <p className="text-sm text-[#8A7B68] mt-0.5">{money(p.price_per_100g)}<span className="text-xs">/100g</span></p>
                </button>
              ))}
            </div>
          )}
        </>
      ) : (
        <div className="rounded-2xl border border-[#E3D8C3] bg-white p-5">
          <button onClick={()=>setPick(null)} className="flex items-center gap-1 text-sm text-[#6B5D4F] mb-3"><I.back className="w-4 h-4"/> Change product</button>
          <p className="font-display text-2xl font-semibold text-[#3A2E22]">{pick.name}</p>
          <p className="text-sm text-[#8A7B68] mb-4">{money(pick.price_per_100g)} per 100g</p>

          <p className="text-xs font-semibold uppercase tracking-wide text-[#6B5D4F] mb-2">Weight</p>
          <div className="grid grid-cols-3 gap-2 mb-4">
            {BANDS.map(g => (
              <button key={g} onClick={()=>setGrams(g)}
                className={"rounded-lg py-2.5 text-sm font-semibold border transition " + (grams===g ? "bg-[#3B6B35] text-white border-[#3B6B35]" : "bg-white text-[#3A2E22] border-[#E3D8C3]")}>{gramsLabel(g)}</button>
            ))}
          </div>

          <p className="text-xs font-semibold uppercase tracking-wide text-[#6B5D4F] mb-2">Quantity</p>
          <div className="flex items-center gap-3 mb-5">
            <button onClick={()=>setQty(Math.max(1,qty-1))} className="w-11 h-11 rounded-lg border border-[#E3D8C3] text-xl font-semibold">−</button>
            <span className="w-10 text-center font-display text-2xl font-semibold">{qty}</span>
            <button onClick={()=>setQty(qty+1)} className="w-11 h-11 rounded-lg border border-[#E3D8C3] text-xl font-semibold">+</button>
          </div>

          <input value={name} onChange={e=>setName(e.target.value)} placeholder="Your name (optional)"
            className="w-full rounded-xl border border-[#E3D8C3] bg-white px-4 py-2.5 mb-4 text-sm outline-none focus:border-[#3B6B35]" />

          <div className="flex items-center justify-between mb-3">
            <span className="text-[#6B5D4F]">Amount</span>
            <span className="font-display text-2xl font-semibold text-[#3B6B35]">{money(amount)}</span>
          </div>
          <button onClick={save} disabled={saving}
            className="w-full rounded-xl bg-[#3B6B35] text-white py-3.5 font-semibold text-lg active:scale-[.99] disabled:opacity-60">
            {saving ? "Saving…" : "Save sale"}
          </button>
        </div>
      )}

      {/* today's list */}
      {today.length > 0 && !pick && (
        <div className="mt-6">
          <p className="text-xs font-semibold uppercase tracking-wide text-[#6B5D4F] mb-2">Today's sales</p>
          <div className="space-y-1.5">
            {today.slice(0,20).map(s => (
              <div key={s.id} className="flex items-center justify-between bg-white rounded-lg border border-[#EEE4D2] px-3.5 py-2.5">
                <div className="min-w-0">
                  <p className="font-medium text-sm truncate">{s.product_name} <span className="text-[#8A7B68]">· {gramsLabel(s.grams)}{s.qty>1?` ×${s.qty}`:''}</span></p>
                  <p className="text-xs text-[#A89A85]">{fmtDate(s.created_at)}{s.sold_by?` · ${s.sold_by}`:''}</p>
                </div>
                <div className="flex items-center gap-2 shrink-0">
                  <span className="font-semibold text-sm">{money(s.sale_amount)}</span>
                  <button onClick={()=>del(s.id)} className="text-[#C77] p-1" aria-label="Remove"><I.trash className="w-4 h-4"/></button>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ================= OWNER — PIN GATE ================= */
function PinGate({ onOk, onBack }) {
  const [pin, setPin] = useState("");
  const [err, setErr] = useState(false);
  const submit = () => { if (pin === String(CFG.OWNER_PIN)) onOk(); else { setErr(true); setPin(""); } };
  return (
    <div className="max-w-xs mx-auto px-5 py-16 text-center">
      <div className="w-14 h-14 rounded-2xl bg-[#3B6B35] text-white grid place-items-center mx-auto mb-4"><I.lock className="w-6 h-6"/></div>
      <h2 className="font-display text-2xl font-semibold text-[#3A2E22]">Owner access</h2>
      <p className="text-[#6B5D4F] text-sm mt-1 mb-6">Enter your PIN to see profit and manage products.</p>
      <input type="password" inputMode="numeric" value={pin} autoFocus
        onChange={e=>{setPin(e.target.value); setErr(false);}}
        onKeyDown={e=>e.key==='Enter'&&submit()}
        className={"w-full text-center tracking-[0.5em] text-2xl rounded-xl border bg-white px-4 py-3 outline-none " + (err?"border-red-400":"border-[#E3D8C3] focus:border-[#3B6B35]")} />
      {err && <p className="text-red-500 text-sm mt-2">Wrong PIN, try again.</p>}
      <button onClick={submit} className="w-full mt-4 rounded-xl bg-[#3B6B35] text-white py-3 font-semibold">Unlock</button>
      <button onClick={onBack} className="mt-3 text-sm text-[#6B5D4F]">← Back to sales</button>
    </div>
  );
}

/* ================= OWNER — DASHBOARD ================= */
function Dashboard({ sales }) {
  const [period, setPeriod] = useState('today');
  const from = startOf(period);
  const rows = sales.filter(s => new Date(s.created_at) >= from);
  const sum = (k) => rows.reduce((a,s)=>a+Number(s[k]),0);
  const totalSales = sum('sale_amount'), totalCost = sum('cost_amount'), totalProfit = sum('profit');
  const margin = totalSales ? (totalProfit/totalSales*100) : 0;

  // per-product
  const byProd = {};
  rows.forEach(s => {
    const k = s.product_name;
    byProd[k] = byProd[k] || { name:k, qty:0, sales:0, profit:0 };
    byProd[k].qty += s.qty; byProd[k].sales += Number(s.sale_amount); byProd[k].profit += Number(s.profit);
  });
  const prodRows = Object.values(byProd).sort((a,b)=>b.profit-a.profit);

  // last 7 days profit bars
  const days = [...Array(7)].map((_,i)=>{ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-(6-i)); return d; });
  const dayProfit = days.map(d => {
    const next = new Date(d); next.setDate(d.getDate()+1);
    return { label:d.toLocaleDateString('en-IN',{weekday:'short'}),
             val: sales.filter(s=>{const t=new Date(s.created_at); return t>=d&&t<next;}).reduce((a,s)=>a+Number(s.profit),0) };
  });
  const maxDay = Math.max(1, ...dayProfit.map(d=>d.val));

  const Stat = ({label, val, tone}) => (
    <div className="rounded-2xl bg-white border border-[#EEE4D2] px-4 py-3.5">
      <p className="text-xs uppercase tracking-wide text-[#8A7B68]">{label}</p>
      <p className={"font-display text-2xl font-semibold mt-0.5 " + (tone||"text-[#3A2E22]")}>{val}</p>
    </div>
  );

  return (
    <div>
      <div className="flex gap-1.5 mb-4 bg-[#F1E9D7] p-1 rounded-full">
        {[['today','Today'],['week','Week'],['month','Month'],['all','All']].map(([k,l])=>(
          <button key={k} onClick={()=>setPeriod(k)}
            className={"flex-1 py-1.5 rounded-full text-sm font-semibold transition " + (period===k?"bg-white text-[#3B6B35] shadow-sm":"text-[#8A7B68]")}>{l}</button>
        ))}
      </div>

      <div className="grid grid-cols-2 gap-2.5 mb-3">
        <Stat label="Sales" val={money(totalSales)} />
        <Stat label="Cost" val={money(totalCost)} />
        <Stat label="Profit" val={money(totalProfit)} tone={totalProfit>=0?"text-[#3B6B35]":"text-red-600"} />
        <Stat label="Margin" val={margin.toFixed(1)+"%"} tone="text-[#B8791E]" />
      </div>

      <div className="rounded-2xl bg-white border border-[#EEE4D2] p-4 mb-3">
        <p className="text-xs uppercase tracking-wide text-[#8A7B68] mb-3">Profit — last 7 days</p>
        <div className="flex items-end justify-between gap-2 h-24">
          {dayProfit.map((d,i)=>(
            <div key={i} className="flex-1 flex flex-col items-center gap-1">
              <div className="w-full rounded-t-md bg-[#7DA85F]" style={{height: Math.max(3,(d.val/maxDay)*80)+'px'}} title={money(d.val)}></div>
              <span className="text-[10px] text-[#A89A85]">{d.label}</span>
            </div>
          ))}
        </div>
      </div>

      {prodRows.length>0 && (
        <div className="rounded-2xl bg-white border border-[#EEE4D2] p-4 mb-3">
          <p className="text-xs uppercase tracking-wide text-[#8A7B68] mb-2">By product</p>
          <table className="w-full text-sm">
            <thead><tr className="text-[#A89A85] text-xs"><th className="text-left font-medium pb-1">Product</th><th className="text-right font-medium pb-1">Qty</th><th className="text-right font-medium pb-1">Sales</th><th className="text-right font-medium pb-1">Profit</th></tr></thead>
            <tbody>
              {prodRows.map(r=>(
                <tr key={r.name} className="border-t border-[#F2EAD8]">
                  <td className="py-1.5 pr-2">{r.name}</td>
                  <td className="py-1.5 text-right text-[#8A7B68]">{r.qty}</td>
                  <td className="py-1.5 text-right">{money(r.sales)}</td>
                  <td className="py-1.5 text-right font-semibold text-[#3B6B35]">{money(r.profit)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {rows.length===0 && <p className="text-center text-[#8A7B68] py-8 text-sm">No sales in this period yet.</p>}
    </div>
  );
}

/* ================= OWNER — RECENT SALES ================= */
function RecentSales({ sales, reload }) {
  const del = async (id) => { if(!confirm("Delete this sale?"))return; await sb.from('sales').delete().eq('id',id); reload(); };
  const exportCsv = () => {
    const head = ["Date","Product","Grams","Qty","Sale","Cost","Profit","Sold by"];
    const lines = sales.map(s=>[new Date(s.created_at).toLocaleString('en-IN'),s.product_name,s.grams,s.qty,s.sale_amount,s.cost_amount,s.profit,s.sold_by||""]
      .map(v=>`"${String(v).replace(/"/g,'""')}"`).join(","));
    const blob = new Blob([[head.join(","),...lines].join("\n")],{type:'text/csv'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`sales-${new Date().toISOString().slice(0,10)}.csv`; a.click();
  };
  return (
    <div>
      <div className="flex items-center justify-between mb-3">
        <p className="text-xs uppercase tracking-wide text-[#8A7B68]">Recent sales</p>
        <button onClick={exportCsv} className="flex items-center gap-1.5 text-sm font-semibold text-[#3B6B35] px-3 py-1.5 rounded-full border border-[#CFE0BD]"><I.down className="w-4 h-4"/> Export CSV</button>
      </div>
      <div className="space-y-1.5">
        {sales.slice(0,80).map(s=>(
          <div key={s.id} className="flex items-center justify-between bg-white rounded-lg border border-[#EEE4D2] px-3.5 py-2.5">
            <div className="min-w-0">
              <p className="font-medium text-sm truncate">{s.product_name} <span className="text-[#8A7B68]">· {gramsLabel(s.grams)}{s.qty>1?` ×${s.qty}`:''}</span></p>
              <p className="text-xs text-[#A89A85]">{fmtDate(s.created_at)}{s.sold_by?` · ${s.sold_by}`:''}</p>
            </div>
            <div className="flex items-center gap-3 shrink-0 text-right">
              <div><p className="text-sm font-semibold">{money(s.sale_amount)}</p><p className="text-xs text-[#3B6B35]">+{money(s.profit)}</p></div>
              <button onClick={()=>del(s.id)} className="text-[#C77] p-1"><I.trash className="w-4 h-4"/></button>
            </div>
          </div>
        ))}
        {sales.length===0 && <p className="text-center text-[#8A7B68] py-8 text-sm">No sales recorded yet.</p>}
      </div>
    </div>
  );
}

/* ================= OWNER — PRODUCTS ================= */
function Products({ products, reload, toast }) {
  const [form, setForm] = useState({ name:"", cost:"", price:"" });
  const [editId, setEditId] = useState(null);
  const [edit, setEdit] = useState({ cost:"", price:"" });
  const [csv, setCsv] = useState(""); const [showImport, setShowImport] = useState(false);

  const add = async () => {
    if (!form.name.trim()) return;
    const { error } = await sb.from('products').insert({ name:form.name.trim(), cost_per_100g:+form.cost||0, price_per_100g:+form.price||0 });
    if (error) { toast("Couldn't add"); return; }
    setForm({name:"",cost:"",price:""}); toast("Product added"); reload();
  };
  const saveEdit = async (id) => {
    await sb.from('products').update({ cost_per_100g:+edit.cost||0, price_per_100g:+edit.price||0 }).eq('id',id);
    setEditId(null); reload();
  };
  const toggle = async (p) => { await sb.from('products').update({ active: p.active===false }).eq('id',p.id); reload(); };
  const remove = async (id) => { if(!confirm("Delete product? Past sales stay.")) return; await sb.from('products').delete().eq('id',id); reload(); };
  const importCsv = async () => {
    const rows = csv.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
      const [name,cost,price] = l.split(","); return { name:(name||"").trim(), cost_per_100g:+cost||0, price_per_100g:+price||0 };
    }).filter(r=>r.name && r.name.toLowerCase()!=='name');
    if (!rows.length) return;
    const { error } = await sb.from('products').insert(rows);
    if (error) { toast("Import failed"); return; }
    setCsv(""); setShowImport(false); toast(`${rows.length} products added`); reload();
  };

  return (
    <div>
      <div className="rounded-2xl bg-white border border-[#EEE4D2] p-4 mb-4">
        <p className="text-xs uppercase tracking-wide text-[#8A7B68] mb-2">Add product</p>
        <input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Product name"
          className="w-full rounded-lg border border-[#E3D8C3] px-3 py-2 mb-2 outline-none focus:border-[#3B6B35]" />
        <div className="grid grid-cols-2 gap-2 mb-3">
          <input value={form.cost} onChange={e=>setForm({...form,cost:e.target.value})} inputMode="decimal" placeholder="Cost /100g"
            className="rounded-lg border border-[#E3D8C3] px-3 py-2 outline-none focus:border-[#3B6B35]" />
          <input value={form.price} onChange={e=>setForm({...form,price:e.target.value})} inputMode="decimal" placeholder="Sell /100g"
            className="rounded-lg border border-[#E3D8C3] px-3 py-2 outline-none focus:border-[#3B6B35]" />
        </div>
        <button onClick={add} className="w-full flex items-center justify-center gap-1.5 rounded-lg bg-[#3B6B35] text-white py-2.5 font-semibold"><I.plus className="w-4 h-4"/> Add</button>
        <button onClick={()=>setShowImport(!showImport)} className="w-full mt-2 text-sm text-[#6B5D4F]">{showImport?"Hide bulk import":"Bulk import from CSV"}</button>
        {showImport && (
          <div className="mt-2">
            <p className="text-xs text-[#8A7B68] mb-1">One product per line: <code>name,cost,sell</code></p>
            <textarea value={csv} onChange={e=>setCsv(e.target.value)} rows="4" placeholder={"Cashew,72,90\nPista Plain,240,290"}
              className="w-full rounded-lg border border-[#E3D8C3] px-3 py-2 text-sm outline-none focus:border-[#3B6B35]" />
            <button onClick={importCsv} className="w-full mt-2 rounded-lg bg-[#B8791E] text-white py-2 font-semibold text-sm">Import</button>
          </div>
        )}
      </div>

      <p className="text-xs uppercase tracking-wide text-[#8A7B68] mb-2">{products.length} products</p>
      <div className="space-y-1.5">
        {products.map(p=>(
          <div key={p.id} className={"bg-white rounded-lg border border-[#EEE4D2] px-3.5 py-2.5 " + (p.active===false?"opacity-50":"")}>
            {editId===p.id ? (
              <div className="flex items-center gap-2">
                <span className="flex-1 font-medium text-sm truncate">{p.name}</span>
                <input value={edit.cost} onChange={e=>setEdit({...edit,cost:e.target.value})} className="w-16 rounded border border-[#E3D8C3] px-2 py-1 text-sm" placeholder="cost"/>
                <input value={edit.price} onChange={e=>setEdit({...edit,price:e.target.value})} className="w-16 rounded border border-[#E3D8C3] px-2 py-1 text-sm" placeholder="sell"/>
                <button onClick={()=>saveEdit(p.id)} className="text-[#3B6B35] font-semibold text-sm">Save</button>
              </div>
            ) : (
              <div className="flex items-center justify-between">
                <div className="min-w-0">
                  <p className="font-medium text-sm truncate">{p.name}</p>
                  <p className="text-xs text-[#8A7B68]">Cost {money(p.cost_per_100g)} · Sell {money(p.price_per_100g)} · <span className="text-[#3B6B35]">Margin {p.price_per_100g?(((p.price_per_100g-p.cost_per_100g)/p.price_per_100g)*100).toFixed(0):0}%</span></p>
                </div>
                <div className="flex items-center gap-2 shrink-0 text-sm">
                  <button onClick={()=>{setEditId(p.id); setEdit({cost:p.cost_per_100g, price:p.price_per_100g});}} className="text-[#6B5D4F]">Edit</button>
                  <button onClick={()=>toggle(p)} className="text-[#8A7B68]">{p.active===false?"Show":"Hide"}</button>
                  <button onClick={()=>remove(p.id)} className="text-[#C77]"><I.trash className="w-4 h-4"/></button>
                </div>
              </div>
            )}
          </div>
        ))}
        {products.length===0 && <p className="text-center text-[#8A7B68] py-8 text-sm">Add your products above to get started.</p>}
      </div>
    </div>
  );
}

/* ================= OWNER SHELL ================= */
function Owner({ products, sales, reload, toast, onBack }) {
  const [tab, setTab] = useState('dash');
  const tabs = [['dash','Dashboard',I.chart],['sales','Sales',I.cart],['products','Products',I.box]];
  return (
    <div className="max-w-md mx-auto px-4 pb-28">
      <header className="pt-6 pb-4 flex items-center justify-between">
        <div>
          <p className="text-[#6B5D4F] text-sm">{CFG.SHOP_NAME}</p>
          <h1 className="font-display text-3xl font-semibold text-[#3B6B35] leading-tight">Owner</h1>
        </div>
        <button onClick={onBack} className="text-sm text-[#6B5D4F] px-3 py-1.5 rounded-full border border-[#E3D8C3]">Exit</button>
      </header>
      <div className="flex gap-1.5 mb-5 bg-[#F1E9D7] p-1 rounded-full">
        {tabs.map(([k,l,Ic])=>(
          <button key={k} onClick={()=>setTab(k)}
            className={"flex-1 flex items-center justify-center gap-1.5 py-2 rounded-full text-sm font-semibold transition " + (tab===k?"bg-white text-[#3B6B35] shadow-sm":"text-[#8A7B68]")}>
            <Ic className="w-4 h-4"/> {l}
          </button>
        ))}
      </div>
      {tab==='dash' && <Dashboard sales={sales} />}
      {tab==='sales' && <RecentSales sales={sales} reload={reload} />}
      {tab==='products' && <Products products={products} reload={reload} toast={toast} />}
    </div>
  );
}

/* ================= ROOT ================= */
function App() {
  if (!CONFIGURED) return <Setup />;
  const [products, setProducts] = useState([]);
  const [sales, setSales] = useState([]);
  const [view, setView] = useState('sale');      // 'sale' | 'gate' | 'owner'
  const [toastMsg, setToastMsg] = useState("");
  const toast = (m)=>{ setToastMsg(m); setTimeout(()=>setToastMsg(""),1800); };

  const reload = useCallback(async () => {
    const [{ data: p }, { data: s }] = await Promise.all([
      sb.from('products').select('*').order('name'),
      sb.from('sales').select('*').order('created_at',{ascending:false})
    ]);
    setProducts(p||[]); setSales(s||[]);
  }, []);

  useEffect(()=>{
    reload();
    const ch = sb.channel('rt')
      .on('postgres_changes',{event:'*',schema:'public',table:'sales'}, reload)
      .on('postgres_changes',{event:'*',schema:'public',table:'products'}, reload)
      .subscribe();
    return ()=>{ sb.removeChannel(ch); };
  },[reload]);

  return (
    <>
      {view==='sale'  && <SaleScreen products={products} sales={sales} reload={reload} toast={toast} goOwner={()=>setView('gate')} />}
      {view==='gate'  && <PinGate onOk={()=>setView('owner')} onBack={()=>setView('sale')} />}
      {view==='owner' && <Owner products={products} sales={sales} reload={reload} toast={toast} onBack={()=>setView('sale')} />}
      <Toast msg={toastMsg} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
